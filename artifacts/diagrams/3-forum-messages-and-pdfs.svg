" y2="184" marker-end="url(#h)"/><rect class="lbg" x="401.8" y="164" width="196.4" height="18" rx="9"/><circle class="bdg" cx="412.8" cy="173" r="10"/><text class="bdt" x="412.8" y="177">2</text><text class="mt" x="426.8" y="177" text-anchor="start">quota ≤10/h, put UPLOAD#id</text><line class="a dash" x1="376.0" y1="224" x2="146.0" y2="224" marker-end="url(#h)"/><rect class="lbg" x="168.2" y="204" width="183.60000000000002" height="18" rx="9"/><circle class="bdg" cx="179.2" cy="213" r="10"/><text class="bdt" x="179.2" y="217">3</text><text class="mt" x="193.2" y="217" text-anchor="start">presigned PUT URL (60 s)</text><line class="a" x1="144.0" y1="264" x2="854.0" y2="264" marker-end="url(#h)"/><rect class="lbg" x="395.4" y="244" width="209.20000000000002" height="18" rx="9"/><circle class="bdg" cx="406.4" cy="253" r="10"/><text class="bdt" x="406.4" y="257">4</text><text class="mt" x="420.4" y="257" text-anchor="start">PUT file  (If-None-Match: *)</text><line class="a" x1="144.0" y1="304" x2="374.0" y2="304" marker-end="url(#h)"/><rect class="lbg" x="190.6" y="284" width="138.8" height="18" rx="9"/><circle class="bdg" cx="201.6" cy="293" r="10"/><text class="bdt" x="201.6" y="297">5</text><text class="mt" x="215.6" y="297" text-anchor="start">GET upload status</text><line class="a" x1="384.0" y1="344" x2="854.0" y2="344" marker-end="url(#h)"/><rect class="lbg" x="528.2" y="324" width="183.60000000000002" height="18" rx="9"/><circle class="bdg" cx="539.2" cy="333" r="10"/><text class="bdt" x="539.2" y="337">6</text><text class="mt" x="553.2" y="337" text-anchor="start">HEAD + GET exact version</text><polyline class="a" points="380.0,372 414.0,372 414.0,388 384.0,388" marker-end="url(#h)"/><circle class="bdg" cx="430.0" cy="380" r="10"/><text class="bdt" x="430.0" y="384">7</text><text class="mt" x="446.0" y="384" text-anchor="start">is it a real PDF? → mark ready</text><line class="sep" x1="20" y1="410" x2="980" y2="410"/><text class="sept" x="500.0" y="426">Post t