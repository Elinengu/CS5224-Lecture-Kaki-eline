<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460"><style>/* SVG styling */
.b { stroke-width: 1.6; }
.c { stroke-width: 1.6; stroke-dasharray: 6 4; }
.k-user { fill: #ffffff; stroke: #18212c; border-color: #18212c; background: #ffffff; }
.k-edge { fill: #e3ecfb; stroke: #3f69c0; border-color: #3f69c0; background: #e3ecfb; }
.k-fn { fill: #fdeedb; stroke: #c4741a; border-color: #c4741a; background: #fdeedb; }
.k-fn2 { fill: #fff8ef; stroke: #c4741a; }
.k-data { fill: #e2f3e8; stroke: #2c8a4f; border-color: #2c8a4f; background: #e2f3e8; }
.k-auth { fill: #f2e5f7; stroke: #8746a2; border-color: #8746a2; background: #f2e5f7; }
.k-ext { fill: #eceff3; stroke: #6a7482; border-color: #6a7482; background: #eceff3; }
.k-ops { fill: #fbe8e9; stroke: #b5414a; border-color: #b5414a; background: #fbe8e9; }
.bt { fill: #18212c; font: 600 13.5px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
.bs { fill: #5b6676; font: 400 11.5px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
.ct { fill: #c4741a; font: 600 12.5px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.note { fill: #5b6676; font: 400 11.5px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
.note.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #18212c; }
.a { fill: none; stroke: #6f7b8b; stroke-width: 1.6; }
.a.dash { stroke-dasharray: 5 4; }
.ah { fill: #6f7b8b; }
.bdg { fill: #0e6b78; }
.bdt { fill: #ffffff; font: 600 11px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
.lbg { fill: #ffffff; stroke: #d8dee6; }
.lt, .mt { fill: #18212c; font: 500 11.5px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
.life { stroke: #d8dee6; stroke-width: 1.5; stroke-dasharray: 3 4; }
.sep { stroke: #d8dee6; stroke-width: 1; }
.sept { fill: #0e6b78; font: 600 12px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 8px; }

