.ah { fill: #6f7b8b; }
.bdg { fill: #0e6b78; }
.bdt { fill: #ffffff; font: 600 11px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
.lbg { fill: #ffffff; stroke: #d8dee6; }
.lt, .mt { fill: #18212c; font: 500 11.5px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
.life { stroke: #d8dee6; stroke-width: 1.5; stroke-dasharray: 3 4; }
.sep { stroke: #d8dee6; stroke-width: 1; }
.sept { fill: #0e6b78; font: 600 12px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 8px; }

